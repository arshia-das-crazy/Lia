<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="lia-logo-title lia-logo-desc">
  <title id="lia-logo-title">LIA Lingerie</title>
  <desc id="lia-logo-desc">نشان دایره‌ای لیا — قاب طلایی، تایپوگرافی عاجی و نگین شرابی</desc>

  <!-- outer champagne-gold ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#C9A76B" stroke-width="1.6" />
  <!-- inner hairline ring -->
  <circle cx="60" cy="60" r="49" fill="none" stroke="#C9A76B" stroke-opacity="0.35" stroke-width="0.8" />

  <!-- serif monogram -->
  <text
    x="60"
    y="66"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="500"
    letter-spacing="4"
    fill="#EFE3D0">LIA</text>

  <!-- burgundy diamond pendant -->
  <rect x="55.4" y="80.4" width="9.2" height="9.2" rx="1.5" fill="#6E2138" transform="rotate(45 60 85)" />
</svg>
